name: Test "approved" label
on:
  pull_request_review:
    types: [submitted]

# The default GITHUB_TOKEN must be able to write labels; without this
# block, repos that default the token to read-only see a 403 from the
# API call inside the action.
permissions:
  pull-requests: write

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add "approved" label
        uses: ./
        with:
          MIN_APPROVALS: 1
          LABEL: 'approved'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
